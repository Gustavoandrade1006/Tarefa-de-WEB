<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<<body class="bg-light">>
    <main class="container py-5"><div class="card shadow-sm"><div class="card-body"><h1 class="mb-4">Update Task</h1>
    <form action="/tasks/update?_method=PUT" method="POST">
        <input type="hidden" name="_method" value="PUT">
        id: <input class="form-control mb-3" type="text" name="id">
        title: <input class="form-control mb-3" type="text" name="title">
        completed: <select class="form-select mb-3" name="completed">
            <option value="0">Incompleto</option>
            <option value="1">Completo</option>
        </select>
        <button class="btn btn-primary" type="submit">Atualizar tarefa</button>
    </form>
</<body class="bg-light">>
</html>
